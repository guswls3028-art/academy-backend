name: Backend Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contract:
    name: Backend static and migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install static tooling
        run: python -m pip install --disable-pip-version-check --quiet ruff
      - name: Ruff and architecture boundaries
        run: |
          python -m ruff check apps/ academy/
          python scripts/lint/check_submission_lifecycle_boundary.py
          python -m unittest scripts.lint.test_check_safe_method_writes
          python scripts/lint/check_safe_method_writes.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/lint/refactor_boundary_snapshot.py \
              --strict-touched \
              --base-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/lint/refactor_boundary_snapshot.py --strict-touched
          fi
          python scripts/lint/refactor_boundary_snapshot.py --enforce-baseline
      - name: Expand/contract migration boundary
        run: |
          python -m unittest scripts.lint.test_check_expand_contract_migrations
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="HEAD^"
          fi
          ARGS=(--base-ref "$BASE_REF")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--allow-contract-review)
          fi
          python scripts/lint/check_expand_contract_migrations.py "${ARGS[@]}"

  django-contract:
    name: Backend Django smoke and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/constraints.txt
            requirements/common.txt
            requirements/api.txt
            requirements/test.txt
      - name: Install application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Django configuration and migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python manage.py check --settings apps.api.config.settings.test
          python manage.py makemigrations --check --dry-run --settings apps.api.config.settings.test
      - name: OpenAPI generated contract drift
        run: python scripts/generate_openapi_schema.py --check
      - name: Smoke tests and coverage seed
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python -m coverage erase
          python -m coverage run --parallel-mode --source=apps,academy -m pytest tests/test_smoke.py tests/test_critical_academy_journey.py -v --tb=short -x
      - name: Full backend tests and coverage
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python -m coverage run --parallel-mode --source=apps,academy -m pytest -q --tb=short \
            apps/api apps/billing apps/core apps/shared apps/support apps/domains tests \
            --ignore=tests/test_smoke.py \
            --ignore=tests/test_critical_academy_journey.py
          python -m coverage combine
          python -m coverage report --fail-under=60.5 --skip-covered --show-missing
      - name: Deployment contract tests
        shell: pwsh
        run: |
          python -B -m unittest scripts.v1.test_frontend_development_qa -v
          if ($LASTEXITCODE -ne 0) { throw "Frontend development QA boundary contracts failed." }
          ./scripts/codex/test-change-risk-contract.ps1
          ./scripts/codex/test-production-release-bundle-contract.ps1
          ./scripts/v1/test-verification-contract.ps1
          ./scripts/v1/test-candidate-env-contract.ps1
          ./scripts/v1/test-aws-json-utf8-contract.ps1
          ./scripts/v1/test-production-source-freshness.ps1
          ./scripts/v1/test-rds-restore-drill-contract.ps1
          ./scripts/v1/test-workflow-governance-contract.ps1
          ./scripts/v1/test-product-analytics-operations-contract.ps1
      - name: Parse every deployment PowerShell script
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/v1,scripts/codex -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors) {
              $errors += $parseErrors | ForEach-Object {
                "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($errors) { throw ($errors -join [Environment]::NewLine) }
          Write-Host "POWERSHELL_PARSE_PASS"

  postgresql-contract:
    name: PostgreSQL transaction and tenant contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: apps.api.config.settings.test_pg
      TEST_DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/constraints.txt
            requirements/common.txt
            requirements/api.txt
            requirements/test.txt
      - name: Install application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Verify isolated PostgreSQL boundary
        run: |
          python manage.py check --settings apps.api.config.settings.test_pg
          python - <<'PY'
          import django

          django.setup()

          from django.db import connection

          assert connection.vendor == "postgresql", connection.vendor
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_database(), current_user")
              database_name, database_user = cursor.fetchone()
          assert database_name == "postgres", database_name
          assert database_user == "postgres", database_user
          PY
      - name: Full backend regression on PostgreSQL
        run: |
          python -m pytest -q --tb=short \
            apps/api apps/billing apps/core apps/shared apps/support apps/domains tests

  curl-fixed-system-probe:
    name: ARM64 OCR libcurl build and vulnerability probe
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      ACADEMY_DEPLOY_LOCK_TABLE: academy-v1-video-job-lock
      ACADEMY_DEPLOY_LOCK_OWNER: ci-curl-probe:${{ github.run_id }}:${{ github.run_attempt }}
      ECR_REGISTRY: 809466760795.dkr.ecr.ap-northeast-2.amazonaws.com
      PROBE_TAG: curl-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Build exact ARM64 OCR system targets
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/arm64 \
            --build-arg "APT_REFRESH_TOKEN=curl-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --file docker/Dockerfile.base \
            --tag academy-base:curl-probe \
            .
          while IFS='|' read -r service dockerfile; do
            docker build \
              --platform linux/arm64 \
              --target curl-fixed-system \
              --build-arg BASE_IMAGE=academy-base:curl-probe \
              --file "$dockerfile" \
              --tag "academy-${service}:curl-probe" \
              .
          done <<'EOF'
          api|docker/api/Dockerfile
          ai-worker-cpu|docker/ai-worker-cpu/Dockerfile
          tools-worker|docker/tools-worker/Dockerfile
          EOF
      - name: Verify package and OCR linkage, then expose Trivy advisory result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/curl-probe"
          for service in api ai-worker-cpu tools-worker; do
            image="academy-${service}:curl-probe"
            docker run --rm --user root --entrypoint sh "$image" -c '
              set -eu
              test "$(dpkg-query -W -f="\${Version}" libcurl4t64)" = "8.21.0-2~bpo13+1"
              test "$(dpkg-query -W -f="\${Version}" libnghttp3-9)" = "1.15.0-1~bpo13+1"
              test "$(dpkg-query -W -f="\${Version}" libngtcp2-16)" = "1.22.1-1~bpo13+1"
              test "$(dpkg-query -W -f="\${Version}" libngtcp2-crypto-ossl0)" = "1.22.1-1~bpo13+1"
              tesseract --version >/dev/null
              ldd "$(command -v tesseract)" | grep -q "libcurl.so.4"
              test -z "$(dpkg --audit)"
              apt-get check
            '
            report="${RUNNER_TEMP}/curl-probe/${service}.json"
            trivy image --quiet --scanners vuln --format json --output "$report" "$image"
            jq -c '[.Results[]?.Vulnerabilities[]? | select(
              .VulnerabilityID == "CVE-2026-8924" or
              .VulnerabilityID == "CVE-2026-8927"
            ) | {
              id: .VulnerabilityID,
              package: .PkgName,
              installed: .InstalledVersion,
              fixed: .FixedVersion,
              status: .Status,
              source: .DataSource.Name
            }]' "$report"
            target_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(
              .VulnerabilityID == "CVE-2026-8924" or
              .VulnerabilityID == "CVE-2026-8927"
            )] | length' "$report")
            if [ "$target_count" -ne 0 ]; then
              echo "::warning::Trivy Debian advisory metadata still marks the upstream-fixed libcurl build affected"
            fi
            jq -r --arg service "$service" '
              [.Results[]?.Vulnerabilities[]?
               | select(.Severity == "CRITICAL" or .Severity == "HIGH")
               | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion]]
              | unique | sort
              | "TRIVY_SCAN service=\($service) critical_high=\(length) identities=\(.)"
            ' "$report"
            echo "TRIVY_CURL_TARGET_RESULT service=${service} libcurl=8.21.0-2~bpo13+1 targetCount=${target_count}"
          done
      - name: Configure AWS credentials for isolated ECR scan
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180
      - name: Acquire shared mutation lock for probe tags
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v1/deployment_lock.py acquire \
            --owner "$ACADEMY_DEPLOY_LOCK_OWNER" \
            --ttl-seconds 1800
          echo "acquired=true" >> "$GITHUB_OUTPUT"
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
      - name: Push exact probe targets and read completed ECR scans
        shell: bash
        run: |
          set -euo pipefail
          probe_failed=0
          while IFS='|' read -r service repository; do
            local_image="academy-${service}:curl-probe"
            ecr_image="${ECR_REGISTRY}/${repository}:${PROBE_TAG}"
            docker tag "$local_image" "$ecr_image"
            docker push "$ecr_image"
            digest=$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=${PROBE_TAG}" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid probe digest for ${repository}: ${digest}"
              exit 1
            fi

            scan_status=""
            scan_json=""
            for attempt in $(seq 1 40); do
              if scan_json=$(aws ecr describe-image-scan-findings \
                --repository-name "$repository" \
                --image-id "imageDigest=${digest}" \
                --region "$AWS_REGION" \
                --output json 2>/dev/null); then
                scan_status=$(jq -r '.imageScanStatus.status // empty' <<< "$scan_json")
              fi
              if [ "$scan_status" = "COMPLETE" ]; then break; fi
              if [ "$scan_status" = "FAILED" ] || [ "$scan_status" = "UNSUPPORTED_IMAGE" ]; then
                echo "::error::ECR probe scan failed repository=${repository} digest=${digest} status=${scan_status}"
                exit 1
              fi
              sleep 10
            done
            if [ "$scan_status" != "COMPLETE" ]; then
              echo "::error::ECR probe scan did not complete repository=${repository} digest=${digest}"
              exit 1
            fi

            jq -c --arg repository "$repository" '
              [.imageScanFindings.findings[]? | select(
                .name == "CVE-2026-8924" or .name == "CVE-2026-8927"
              ) | {
                repository: $repository,
                id: .name,
                severity: .severity,
                package: ([.attributes[]? | select(.key == "package_name") | .value][0]),
                installed: ([.attributes[]? | select(.key == "package_version") | .value][0])
              }]' <<< "$scan_json"
            target_count=$(jq '[.imageScanFindings.findings[]? | select(
              .name == "CVE-2026-8924" or .name == "CVE-2026-8927"
            )] | length' <<< "$scan_json")
            echo "ECR_CURL_PROBE repository=${repository} digest=${digest} targetCritical=${target_count}"
            if [ "$target_count" -ne 0 ]; then probe_failed=1; fi
          done <<'EOF'
          api|academy-api
          ai-worker-cpu|academy-ai-worker-cpu
          tools-worker|academy-tools-worker
          EOF
          exit "$probe_failed"
      - name: Delete exact isolated ECR probe digests
        if: always() && steps.lock.outputs.acquired == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for repository in academy-api academy-ai-worker-cpu academy-tools-worker; do
            if ! detail=$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=${PROBE_TAG}" \
              --region "$AWS_REGION" \
              --output json 2>/dev/null); then
              echo "ECR_PROBE_CLEAN repository=${repository} state=absent"
              continue
            fi
            if ! jq -e --arg tag "$PROBE_TAG" '
              (.imageDetails | length) == 1 and
              (.imageDetails[0].imageTags == [$tag]) and
              (.imageDetails[0].imageDigest | test("^sha256:[0-9a-f]{64}$"))
            ' <<< "$detail" >/dev/null; then
              echo "::error::Refusing ambiguous ECR probe cleanup for ${repository}:${PROBE_TAG}"
              exit 1
            fi
            digest=$(jq -r '.imageDetails[0].imageDigest' <<< "$detail")
            aws ecr batch-delete-image \
              --repository-name "$repository" \
              --image-ids "imageDigest=${digest}" \
              --region "$AWS_REGION" >/dev/null
            if aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageDigest=${digest}" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "::error::ECR probe digest remains after exact cleanup: ${repository}@${digest}"
              exit 1
            fi
            echo "ECR_PROBE_CLEAN repository=${repository} digest=${digest} state=absent"
          done
      - name: Release shared mutation lock
        if: always() && steps.lock.outputs.acquired == 'true'
        shell: bash
        run: python3 scripts/v1/deployment_lock.py release --owner "$ACADEMY_DEPLOY_LOCK_OWNER"
